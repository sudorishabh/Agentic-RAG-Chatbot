<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agentic RAG Chatbot</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="26" height="26">
            <defs><linearGradient id="ragMark" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#4f9bff"/><stop offset="1" stop-color="#16b8a3"/>
            </linearGradient></defs>
            <circle cx="16" cy="16" r="14" fill="url(#ragMark)"/>
            <path d="M16 7.5l2.1 4.4 4.4 2.1-4.4 2.1L16 20.5l-2.1-4.4L9.5 14l4.4-2.1z" fill="#fff"/>
          </svg>
        </span>
        <h1 class="brand__title">Agentic RAG Chatbot</h1>
      </div>
      <div class="topbar__right">
        <span id="status" class="status status--unknown" title="Backend status">
          <span class="status__dot"></span>
          <span class="status__label">checking…</span>
        </span>
        <button id="clearChat" class="icon-btn" title="Clear chat" aria-label="Clear chat">🗑</button>
        <button id="settingsToggle" class="icon-btn" title="Settings" aria-label="Settings">⚙</button>
      </div>
    </header>

    <section id="settingsPanel" class="settings" hidden>
      <label class="settings__row">
        <span>API base URL</span>
        <input id="apiBase" type="url" placeholder="http://localhost:8000" autocomplete="off" />
      </label>
      <label class="settings__row">
        <span>Top-K (chunks retrieved — blank = server default)</span>
        <input id="topK" type="number" min="1" max="50" placeholder="server default" autocomplete="off" />
      </label>
      <div class="settings__actions">
        <button id="saveSettings" class="btn btn--primary">Save &amp; reconnect</button>
      </div>
    </section>

    <main id="messages" class="messages" aria-live="polite">
      <div id="emptyState" class="welcome">
        <h2 class="welcome__title">Welcome to Agentic RAG Chatbot</h2>
        <p class="welcome__hint">What would you like to explore today?</p>
        <div id="cards" class="cards"></div>
      </div>
    </main>

    <footer class="composer">
      <div class="composer__box">
        <textarea
          id="input"
          class="composer__input"
          rows="1"
          placeholder="Ask about policies, best practices, or data insights"
        ></textarea>
        <button id="send" class="composer__send" title="Send" aria-label="Send">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M3 20.5 21 12 3 3.5 3 10l12 2-12 2z"/></svg>
        </button>
      </div>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
