[pytest]
# Only the real suite. `redundant/` holds an archived copy of these same test
# files; collecting both makes every module a basename collision and pytest
# aborts the whole run with "import file mismatch".
testpaths = tests
norecursedirs = redundant .venv .git __pycache__ node_modules ui

markers =
    llm: hits the configured LLM deployment; needs credentials and network
